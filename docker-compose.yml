services:
  db:
    image: postgres:17-alpine
    container_name: fieldnotes-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: fieldnotes
      POSTGRES_PASSWORD: fieldnotes
      POSTGRES_DB: fieldnotes
    ports:
      - "5433:5432"
    volumes:
      - fieldnotes_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fieldnotes -d fieldnotes"]
      interval: 2s
      timeout: 5s
      retries: 20

volumes:
  fieldnotes_pg:
